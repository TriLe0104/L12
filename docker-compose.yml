# Default stack for the PXE host. Do not take Argus/Libra ports.
#   Argus  :3000 UI  :8000 API
#   L12    :3333 UI  :8001 API  :5433 Postgres
#
#   cp .env.example .env
#   sudo docker compose up -d --build
#   sudo docker compose down
#
# UI  http://172.25.231.244:3333
# API http://172.25.231.244:8001/docs
name: l12-tri

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: po
      POSTGRES_PASSWORD: po
      POSTGRES_DB: po_calendar
    volumes:
      - l12_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U po -d po_calendar"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    network_mode: host
    environment:
      DATABASE_URL: postgresql+psycopg://po:po@127.0.0.1:5433/po_calendar
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      AUTH_PROVIDER: local
      SEED_ON_START: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://172.25.231.244:3333,http://127.0.0.1:3333}
      CLUSTER_CONTROLLER_URL: ${CLUSTER_CONTROLLER_URL:-http://127.0.0.1:8000}
      CLUSTER_CONTROLLER_USER: ${CLUSTER_CONTROLLER_USER:-admin}
      CLUSTER_CONTROLLER_PASSWORD: ${CLUSTER_CONTROLLER_PASSWORD:-admin}
      CLUSTER_PXE_HOST: ${CLUSTER_PXE_HOST:-127.0.0.1}
      CLUSTER_PXE_USER: ${CLUSTER_PXE_USER:-tril}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    volumes:
      - l12_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        API_PROXY: http://host.docker.internal:8001
        NEXT_PUBLIC_API_BASE: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_PROXY: http://host.docker.internal:8001
      PORT: "3000"
      NEXT_INNER_PORT: "3001"
    ports:
      - "3333:3000"
    depends_on:
      - api

volumes:
  l12_pgdata:
  l12_uploads:
